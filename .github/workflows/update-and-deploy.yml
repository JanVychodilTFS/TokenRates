name: Update and deploy rates API

on:
  schedule:
    # GitHub Actions schedules use UTC. Runs once per day at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch current rate history
        run: python store_credit_rates.py

      - name: Commit rate-history updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rate_history
          if ! git diff --cached --quiet; then
            git commit -m "chore: update credit rates"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Build static API for Pages
        run: |
          python build_rates_api.py
          cp index.html rates/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: rates

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
