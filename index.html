<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenRates API</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #eef2ff;
      background: #0b1020;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(28px, 7vw, 58px);
      border: 1px solid rgba(167, 139, 250, .28);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(30, 41, 79, .94), rgba(15, 23, 42, .96));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #c4b5fd;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2.3rem, 7vw, 4.5rem); letter-spacing: -.06em; }
    .intro { margin: 16px 0 32px; color: #cbd5e1; font-size: 1.08rem; line-height: 1.6; }
    .endpoint {
      display: block;
      margin: 12px 0;
      padding: 18px 20px;
      border: 1px solid rgba(148, 163, 184, .2);
      border-radius: 14px;
      color: #f8fafc;
      background: rgba(2, 6, 23, .45);
      text-decoration: none;
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }
    .endpoint:hover { border-color: #a78bfa; background: rgba(76, 29, 149, .2); transform: translateY(-2px); }
    .method { color: #a78bfa; font: 700 .78rem ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
    code { display: block; margin-top: 7px; font: .95rem ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    footer { margin-top: 30px; color: #94a3b8; font-size: .88rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Static JSON API</p>
    <h1>TokenRates</h1>
    <p class="intro">OpenAI Work and Codex token-credit rates, available as simple JSON files.</p>
    <a class="endpoint" href="latest.json">
      <span class="method">GET</span>
      <code>/latest.json</code>
    </a>
    <a class="endpoint" href="2026-08-21.json">
      <span class="method">GET</span>
      <code>/YYYY-MM-DD.json</code>
    </a>
    <footer>Choose a calendar date to retrieve the matching observed rate period.</footer>
  </main>
</body>
</html>
